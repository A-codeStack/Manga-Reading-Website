<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="">
  <title>Todo App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  
  <div class="main-container">

  <!-- Header -->
  <header>
    <div class="header-info">
      <h1 class="header-title">
        todos
      </h1>
      <p class="header-subtext">
        Stay Organized, Stay Productive
      </p>
    </div>

    <div class="header-meta">
      <p class="header-date">
        Wednesday, Sept 17, 2026
      </p>
    </div>
  </header>

  <!--Main-->
  <main>
    <div class="search-container">
      <input type="text" class="search">
    </div>

    <div class="add-container">
      <input class="add-input" type="text" placeholder="Add Items">
      <button class="add-button" id="add-button">Add</button>
    </div>

    <div class="list-container">
      <ul class="list">
          <li class="list-item">
            <p>Ariel's World</p>
            <button class="delete-button">Delete</button>
            <button class="edit-button">Edit</button>
            <input type="text" class="edit-input" placeholder="Enter New Title">
            <button class="submit-edit">Submit</button>
          </li>
          <li class="list-item">
              <p>Ariel's World</p>
              <button class="delete-button">Delete</button>
              <button class="edit-button">Edit</button>
              <input type="text" class="edit-input" placeholder="Enter New Title">
              <button class="submit-edit">Submit</button>
          </li>
      </ul>

    </div>
  </main>
    
  </div>

  <script src="../scripts/script.js"></script>
</body>
</html>
